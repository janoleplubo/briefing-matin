name: Briefing du matin

on:
  schedule:
    # Plusieurs créneaux entre 4h et 6h (heure de Paris, hiver) : GitHub saute parfois des déclenchements ; seul le premier qui passe génère.
    - cron: "7 3 * * *"
    - cron: "23 3 * * *"
    - cron: "41 3 * * *"
    - cron: "3 4 * * *"
    - cron: "19 4 * * *"
    - cron: "37 4 * * *"
    - cron: "53 4 * * *"
  workflow_dispatch:
    inputs:
      republish:
        description: "Republier sans regénérer (1 = oui)"
        required: false
        default: "0"
      preview:
        description: "Aperçu texte seulement, sans audio ni publication (1 = oui)"
        required: false
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - uses: actions/checkout@v4

      - name: Déjà fait aujourd'hui ?
        id: check
        run: |
          today=$(TZ=Europe/Paris date +%F)
          last=$(python3 -c "import json;print(json.load(open('history.json')).get('last',''))" 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Outils audio
        if: steps.check.outputs.done == 'false'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null 2>&1 || true
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo apt-get install -y -qq libttspico-utils || echo "voix de secours indisponible"

      - name: Génération du briefing
        if: steps.check.outputs.done == 'false'
        timeout-minutes: 25
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE: ${{ vars.VOICE }}
          GITHUB_TOKEN: ${{ github.token }}
          REPUBLISH: ${{ github.event.inputs.republish }}
          PREVIEW: ${{ github.event.inputs.preview }}
        run: python3 generate.py

      - name: Sauvegarde de l'historique (mots, sujets)
        if: steps.check.outputs.done == 'false'
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          for f in history.json status.json preview.txt; do [ -f "$f" ] && git add "$f"; done; true
          git commit -m "Historique du $(TZ=Europe/Paris date +%F)" || exit 0
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.done == 'false' && github.event.inputs.preview != '1'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.done == 'false' && github.event.inputs.preview != '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
