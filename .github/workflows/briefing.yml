name: Briefing du matin

on:
  schedule:
    # 3h30 et 4h30 UTC (4h30 / 5h30 à Paris en hiver). Le 2e passage ne sert que si le 1er a échoué ou a été retardé.
    - cron: "30 3 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - uses: actions/checkout@v4

      - name: Déjà fait aujourd'hui ?
        id: check
        run: |
          today=$(TZ=Europe/Paris date +%F)
          last=$(python3 -c "import json;print(json.load(open('history.json')).get('last',''))" 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Outils audio
        if: steps.check.outputs.done == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo apt-get install -y -qq libttspico-utils || echo "voix de secours indisponible"

      - name: Génération du briefing
        if: steps.check.outputs.done == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE: ${{ vars.VOICE }}
        run: python3 generate.py

      - name: Sauvegarde de l'historique (mots, sujets)
        if: steps.check.outputs.done == 'false'
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add history.json
          git commit -m "Historique du $(TZ=Europe/Paris date +%F)" || exit 0
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.done == 'false'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.done == 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
