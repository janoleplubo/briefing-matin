name: Vélib station
on: workflow_dispatch
permissions:
  contents: write
jobs:
  velib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          B = "https://velib-metropole-opendata.smovengo.cloud/opendata/Velib_Metropole/"
          get = lambda f: json.loads(urllib.request.urlopen(B + f, timeout=30).read())
          info = {s["station_id"]: s for s in get("station_information.json")["data"]["stations"]}
          st = [s for s in get("station_status.json")["data"]["stations"] if str(s.get("stationCode")) == "15105"]
          out = []
          for s in st:
              i = info.get(s["station_id"], {})
              types = {k: v for d in s.get("num_bikes_available_types", []) for k, v in d.items()}
              out.append({"nom": i.get("name"), "code": s.get("stationCode"), "mecaniques_verts": types.get("mechanical"),
                          "electriques_bleus": types.get("ebike"), "places_libres": s.get("numDocksAvailable"),
                          "maj": datetime.datetime.fromtimestamp(s.get("last_reported", 0)).isoformat()})
          json.dump(out or "station introuvable", open("velib.json", "w"), ensure_ascii=False, indent=1)
          PY
          git config user.name "briefing-bot"; git config user.email "briefing-bot@users.noreply.github.com"
          git add velib.json; git commit -m "Vélib" || exit 0; git pull --rebase -q; git push
