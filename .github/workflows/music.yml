name: Récupération musiques libres
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p music
          for t in "Disco Medusae" "Funky Chunk" "Disco con Tutti" "Electro Cabello" "Hyperfun" "Daily Beetle" "Funkeriffic" "Get Down" "Shades of Spring" "Bass Vibes" "Dance Zone" "Pamgaea" "Ouroboros" "Life of Riley" "Inspired"; do
            f="music/$(echo "$t" | tr ' ' '_').mp3"
            u="https://incompetech.com/music/royalty-free/mp3-royaltyfree/$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$t").mp3"
            code=$(curl -sL -A "Mozilla/5.0" -o "$f" -w "%{http_code}" "$u")
            size=$(stat -c %s "$f" 2>/dev/null || echo 0)
            if [ "$code" = "200" ] && [ "$size" -gt 500000 ] && file "$f" | grep -qiE "audio|MPEG|ID3"; then echo "OK $t $size"; else echo "KO $t $code $size"; rm -f "$f"; fi
          done
          ls -la music
      - run: |
          git config user.name "briefing-bot"; git config user.email "briefing-bot@users.noreply.github.com"
          git add music; git commit -m "Musiques libres (Kevin MacLeod, CC BY 4.0)" || exit 0; git pull --rebase -q; git push
