name: Diagnostic Gemini
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/diag.py
      - run: |
          git config user.name "briefing-bot"; git config user.email "briefing-bot@users.noreply.github.com"
          git add diag.json; git commit -m "Diagnostic" || exit 0; git pull --rebase -q; git push
